<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金华车行 - 客户资料与收据管理系统</title>
    <style>
        :root {
            --bg-main: #ffffff;
            --bg-secondary: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --btn-blue-grad: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            --btn-blue-hover: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            --btn-green-grad: linear-gradient(135deg, #34d399 0%, #059669 100%);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); padding: 24px; max-width: 1440px; margin: 0 auto; min-height: 100vh; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            margin-bottom: 24px;
        }

        .brand { display: flex; align-items: center; gap: 16px; }
        .brand-logo {
            width: 48px; height: 48px;
            background: var(--btn-blue-grad);
            color: white; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }

        .brand-info h1 { font-size: 26px; font-weight: 800; color: #0f172a; letter-spacing: 0.5px; }
        .brand-info p { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

        .top-stats { display: flex; gap: 20px; }
        .stat-badge { background: #f1f5f9; padding: 12px 24px; border-radius: 12px; border: 1px solid #e2e8f0; text-align: right; }
        .stat-badge .num { font-size: 22px; font-weight: 800; color: #0284c7; }
        .stat-badge .label { font-size: 12px; color: var(--text-secondary); }

        .nav-tabs { display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        .tab-btn {
            padding: 12px 28px; font-size: 15px; font-weight: 600;
            color: var(--text-secondary); background: transparent; border: none;
            border-radius: 10px; cursor: pointer; transition: all 0.2s ease;
            display: flex; align-items: center; gap: 8px;
        }
        .tab-btn:hover { background: #f1f5f9; color: var(--text-primary); }
        .tab-btn.active { background: var(--btn-blue-grad); color: #ffffff; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3); }

        .btn {
            padding: 11px 22px; border-radius: 10px; font-size: 14px; font-weight: 600;
            border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
            transition: all 0.25s ease; box-shadow: var(--shadow-sm);
        }
        .btn-blue { background: var(--btn-blue-grad); color: #ffffff; }
        .btn-blue:hover { background: var(--btn-blue-hover); transform: translateY(-1px); }
        .btn-green { background: var(--btn-green-grad); color: #ffffff; }
        .btn-outline { background: #ffffff; border: 1px solid var(--border-color); color: var(--text-secondary); }
        .btn-outline:hover { background: #f8fafc; border-color: #cbd5e1; color: var(--text-primary); }
        .btn-danger { background: #ef4444; color: white; }

        .view-panel { display: none; }
        .view-panel.active { display: block; }

        .filter-card { background: #ffffff; padding: 24px; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--shadow-md); margin-bottom: 24px; }
        .filter-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; align-items: end; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 13px; font-weight: 700; color: #334155; }

        input[type="text"], input[type="date"], textarea {
            width: 100%; padding: 11px 14px; border: 1px solid var(--border-color);
            border-radius: 8px; font-size: 14px; outline: none; background: #ffffff;
        }

        .quick-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
        .tag-btn { background: #f1f5f9; border: 1px solid #e2e8f0; padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--text-secondary); }
        .tag-btn.active, .tag-btn:hover { background: #0284c7; color: white; border-color: #0284c7; }

        .action-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }

        .month-group { background: #ffffff; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--shadow-md); margin-bottom: 24px; overflow: hidden; }
        .month-header { background: linear-gradient(90deg, #f8fafc 0%, #ffffff 100%); padding: 18px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .month-title { font-size: 17px; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 10px; }
        .month-count-badge { background: #e0f2fe; color: #0369a1; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
        th { background-color: #f8fafc; color: #475569; font-weight: 700; padding: 14px 18px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
        td { padding: 14px 18px; border-bottom: 1px solid var(--border-color); color: #1e293b; }
        .vin-box { font-family: monospace; background: #f1f5f9; padding: 4px 8px; border-radius: 6px; font-size: 13px; color: #0f172a; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.4); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-overlay.active { display: flex; }
        .modal-card { background: white; border-radius: 20px; width: 90%; max-width: 680px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 1px solid var(--border-color); }
        .modal-header { padding: 20px 28px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-size: 19px; font-weight: 700; }
        .modal-body { padding: 28px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .form-grid .full-span { grid-column: span 2; }
        .modal-footer { padding: 18px 28px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 12px; background: #f8fafc; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
        .empty-placeholder { text-align: center; padding: 60px; color: var(--text-muted); font-size: 15px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-logo">金</div>
            <div class="brand-info">
                <h1>金华车行 - 客户资料与收据管理系统</h1>
                <p>高端客户档案仓库 | 智能多维查询 | 本地安全归档</p>
            </div>
        </div>
        <div class="top-stats">
            <div class="stat-badge">
                <div class="num" id="statTotal">0</div>
                <div class="label">归档客户总数</div>
            </div>
            <div class="stat-badge">
                <div class="num" id="statMonthCount">0</div>
                <div class="label">本月新增客户</div>
            </div>
        </div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" id="tabWarehouse" onclick="switchTab('warehouse')">
            🏛️ 客户仓库 (按月份分类)
        </button>
        <button class="tab-btn" id="tabSearch" onclick="switchTab('search')">
            🔍 客户资料查询
        </button>
    </div>

    <div class="action-toolbar">
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn btn-green" onclick="openAddModal(false)">➕ 手动录入客户资料</button>
            <button class="btn btn-blue" onclick="openAddModal(true)">⚡ 批量连续录入模式</button>
            <button class="btn btn-outline" onclick="loadSampleData()">🧪 加载示例数据</button>
        </div>
        <div>
            <button class="btn btn-outline" onclick="triggerImportCSV()">📤 导入 CSV</button>
            <input type="file" id="csvFileInput" accept=".csv" style="display:none;" onchange="importCSVFile(event)">
            <button class="btn btn-outline" onclick="exportData()">📥 导出 Excel/CSV</button>
        </div>
    </div>

    <div class="view-panel active" id="panelWarehouse">
        <div id="warehouseContainer"></div>
    </div>

    <div class="view-panel" id="panelSearch">
        <div class="filter-card">
            <div class="filter-row">
                <div class="form-group">
                    <label>📅 勾选/指定时间段 (收据/购买日期)</label>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="date" id="startDate" onchange="applySearchFilters()">
                        <span>至</span>
                        <input type="date" id="endDate" onchange="applySearchFilters()">
                    </div>
                    <div class="quick-tags">
                        <button class="tag-btn" onclick="setQuickDate('today')">今天</button>
                        <button class="tag-btn" onclick="setQuickDate('month')">本月</button>
                        <button class="tag-btn" onclick="setQuickDate('quarter')">近3个月</button>
                        <button class="tag-btn" onclick="setQuickDate('year')">近1年</button>
                        <button class="tag-btn active" onclick="setQuickDate('all')">全部</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>🔍 客户搜索 (姓名/电话/车型/车架号/地址)</label>
                    <input type="text" id="searchKeyword" placeholder="输入客户姓名、电话、车架号或车型关键词..." onkeyup="if(event.key==='Enter') applySearchFilters()">
                </div>

                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-blue" onclick="applySearchFilters()">🔍 执行查询</button>
                    <button class="btn btn-outline" onclick="resetSearchFilters()">🔄 重置筛选</button>
                </div>
            </div>
        </div>

        <div class="month-group">
            <div class="month-header">
                <div class="month-title">📋 查询结果列表</div>
                <div class="month-count-badge" id="searchResultCount">共 0 条匹配记录</div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>收据/购买日期</th>
                            <th>客户姓名</th>
                            <th>联系电话</th>
                            <th>购买车型</th>
                            <th>车架号 (VIN)</th>
                            <th>客户地址</th>
                            <th>收据编号</th>
                            <th>备注信息</th>
                            <th style="text-align: center;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="searchTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="customerModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalTitle">新增客户资料</h3>
                <button style="background:none;border:none;font-size:22px;cursor:pointer;" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="customerForm" onsubmit="saveCustomer(event)">
                    <input type="hidden" id="customerId">
                    <div class="form-grid">
                        <div class="form-group"><label>购买日期 *</label><input type="date" id="inputDate" required></div>
                        <div class="form-group"><label>客户姓名 *</label><input type="text" id="inputName" placeholder="例如：张伟" required></div>
                        <div class="form-group"><label>联系电话 *</label><input type="text" id="inputPhone" placeholder="例如：13812345678" required></div>
                        <div class="form-group"><label>购买车型 *</label><input type="text" id="inputCarModel" placeholder="例如：帕萨特 2.0T" required></div>
                        <div class="form-group"><label>车架号 (VIN) *</label><input type="text" id="inputVin" placeholder="17位车架号" style="text-transform: uppercase;" required></div>
                        <div class="form-group"><label>收据编号 (选填)</label><input type="text" id="inputReceiptNo" placeholder="例如：SJ2026080101"></div>
                        <div class="form-group full-span"><label>客户地址</label><input type="text" id="inputAddress" placeholder="例如：北京市朝阳区建国路88号"></div>
                        <div class="form-group full-span"><label>备注信息</label><textarea id="inputNotes" rows="2" placeholder="填写按揭/全款/精品赠送说明..."></textarea></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeModal()">取消</button>
                <button type="submit" form="customerForm" class="btn btn-blue" id="saveBtn">保存记录</button>
            </div>
        </div>
    </div>

    <script>
        var STORAGE_KEY = 'jinhua_car_customers_v1';
        var isRapidMode = false;

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('inputDate').valueAsDate = new Date();
            if (!localStorage.getItem(STORAGE_KEY)) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify([]));
            }
            renderWarehouse();
            loadSearchData();
        });

        function getStoredCustomers() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            } catch (e) {
                return [];
            }
        }

        function setStoredCustomers(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
            renderWarehouse();
            loadSearchData();
        }

        function switchTab(tabName) {
            var tabW = document.getElementById('tabWarehouse');
            var tabS = document.getElementById('tabSearch');
            var panelW = document.getElementById('panelWarehouse');
            var panelS = document.getElementById('panelSearch');

            if (tabName === 'warehouse') {
                tabW.classList.add('active');
                tabS.classList.remove('active');
                panelW.classList.add('active');
                panelS.classList.remove('active');
                renderWarehouse();
            } else {
                tabS.classList.add('active');
                tabW.classList.remove('active');
                panelS.classList.add('active');
                panelW.classList.remove('active');
                loadSearchData();
            }
        }

        function renderWarehouse() {
            var container = document.getElementById('warehouseContainer');
            var list = getStoredCustomers();

            document.getElementById('statTotal').innerText = list.length;
            
            var now = new Date();
            var currentYearMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
            var thisMonthCount = list.filter(function(item) {
                return item.purchase_date && item.purchase_date.indexOf(currentYearMonth) === 0;
            }).length;
            document.getElementById('statMonthCount').innerText = thisMonthCount;

            if (list.length === 0) {
                container.innerHTML = '<div class="month-group"><div class="empty-placeholder">📭 客户仓库暂无档案，请点击上方按钮录入客户资料</div></div>';
                return;
            }

            list.sort(function(a, b) {
                return b.purchase_date.localeCompare(a.purchase_date) || b.id - a.id;
            });

            var groups = {};
            list.forEach(function(item) {
                var monthKey = '未分类日期';
                if (item.purchase_date && item.purchase_date.length >= 7) {
                    var parts = item.purchase_date.split('-');
                    monthKey = parts[0] + '年' + parts + '月';
                }
                if (!groups[monthKey]) {
                    groups[monthKey] = [];
                }
                groups[monthKey].push(item);
            });

            var html = '';
            Object.keys(groups).forEach(function(monthTitle) {
                var monthList = groups[monthTitle];
                html += '<div class="month-group">' +
                    '<div class="month-header">' +
                        '<div class="month-title">📅 ' + monthTitle + ' 客户归档</div>' +
                        '<div class="month-count-badge">本月共 ' + monthList.length + ' 位客户资料</div>' +
                    '</div>' +
                    '<div class="table-wrap"><table>' +
                    '<thead><tr>' +
                        '<th>#</th>' +
                        '<th>收据/购买日期</th>' +
                        '<th>客户姓名</th>' +
                        '<th>联系电话</th>' +
                        '<th>购买车型</th>' +
                        '<th>车架号 (VIN)</th>' +
                        '<th>客户地址</th>' +
                        '<th>收据编号</th>' +
                        '<th>备注信息</th>' +
                        '<th style="text-align: center;">操作</th>' +
                    '</tr></thead><tbody>';

                monthList.forEach(function(c, index) {
                    html += '<tr>' +
                        '<td>' + (index + 1) + '</td>' +
                        '<td><strong>' + escapeHtml(c.purchase_date) + '</strong></td>' +
                        '<td><strong>' + escapeHtml(c.name) + '</strong></td>' +
                        '<td>' + escapeHtml(c.phone) + '</td>' +
                        '<td>' + escapeHtml(c.car_model) + '</td>' +
                        '<td><span class="vin-box">' + escapeHtml(c.vin) + '</span></td>' +
                        '<td>' + escapeHtml(c.address || '-') + '</td>' +
                        '<td>' + escapeHtml(c.receipt_no || '-') + '</td>' +
                        '<td>' + escapeHtml(c.notes || '-') + '</td>' +
                        '<td style="text-align: center;">' +
                            '<button class="btn btn-outline" style="padding:4px 10px;font-size:12px;" onclick="editCustomer(' + c.id + ')">✏️ 编辑</button> ' +
                            '<button class="btn btn-danger" style="padding:4px 10px;font-size:12px;" onclick="deleteCustomer(' + c.id + ', \'' + escapeHtml(c.name) + '\')">🗑️ 删除</button>' +
                        '</td>' +
                    '</tr>';
                });

                html += '</tbody></table></div></div>';
            });

            container.innerHTML = html;
        }

        function loadSearchData() {
            var startDate = document.getElementById('startDate').value;
            var endDate = document.getElementById('endDate').value;
            var search = document.getElementById('searchKeyword').value.trim().toLowerCase();

            var list = getStoredCustomers();
            if (startDate) list = list.filter(function(item) { return item.purchase_date >= startDate; });
            if (endDate) list = list.filter(function(item) { return item.purchase_date <= endDate; });
            if (search) {
                list = list.filter(function(item) {
                    return (item.name && item.name.toLowerCase().indexOf(search) !== -1) ||
                           (item.phone && item.phone.toLowerCase().indexOf(search) !== -1) ||
                           (item.car_model && item.car_model.toLowerCase().indexOf(search) !== -1) ||
                           (item.vin && item.vin.toLowerCase().indexOf(search) !== -1) ||
                           (item.address && item.address.toLowerCase().indexOf(search) !== -1);
                });
            }
            list.sort(function(a, b) {
                return b.purchase_date.localeCompare(a.purchase_date) || b.id - a.id;
            });

            document.getElementById('searchResultCount').innerText = '共 ' + list.length + ' 条匹配记录';
            var tbody = document.getElementById('searchTableBody');
            tbody.innerHTML = '';

            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;color:#94a3b8;">📭 暂无符合条件的查询结果</td></tr>';
                return;
            }

            list.forEach(function(c, index) {
                var tr = document.createElement('tr');
                tr.innerHTML = '<td>' + (index + 1) + '</td>' +
                    '<td><strong>' + escapeHtml(c.purchase_date) + '</strong></td>' +
                    '<td><strong>' + escapeHtml(c.name) + '</strong></td>' +
                    '<td>' + escapeHtml(c.phone) + '</td>' +
                    '<td>' + escapeHtml(c.car_model) + '</td>' +
                    '<td><span class="vin-box">' + escapeHtml(c.vin) + '</span></td>' +
                    '<td>' + escapeHtml(c.address || '-') + '</td>' +
                    '<td>' + escapeHtml(c.receipt_no || '-') + '</td>' +
                    '<td>' + escapeHtml(c.notes || '-') + '</td>' +
                    '<td style="text-align: center;">' +
                        '<button class="btn btn-outline" style="padding:4px 10px;font-size:12px;" onclick="editCustomer(' + c.id + ')">✏️ 编辑</button> ' +
                        '<button class="btn btn-danger" style="padding:4px 10px;font-size:12px;" onclick="deleteCustomer(' + c.id + ', \'' + escapeHtml(c.name) + '\')">🗑️ 删除</button>' +
                    '</td>';
                tbody.appendChild(tr);
            });
        }

        function applySearchFilters() { loadSearchData(); }

        function resetSearchFilters() {
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            document.getElementById('searchKeyword').value = '';
            var tags = document.querySelectorAll('.tag-btn');
            for (var i = 0; i < tags.length; i++) { tags[i].classList.remove('active'); }
            loadSearchData();
        }

        function setQuickDate(type) {
            var tags = document.querySelectorAll('.tag-btn');
            for (var i = 0; i < tags.length; i++) { tags[i].classList.remove('active'); }
            if (event && event.target) { event.target.classList.add('active'); }

            var today = new Date();
            var startInput = document.getElementById('startDate');
            var endInput = document.getElementById('endDate');

            if (type === 'all') { startInput.value = ''; endInput.value = ''; }
            else if (type === 'today') { startInput.value = formatDate(today); endInput.value = formatDate(today); }
            else if (type === 'month') { startInput.value = formatDate(new Date(today.getFullYear(), today.getMonth(), 1)); endInput.value = formatDate(today); }
            else if (type === 'quarter') { var d = new Date(today); d.setMonth(today.getMonth() - 3); startInput.value = formatDate(d); endInput.value = formatDate(today); }
            else if (type === 'year') { startInput.value = formatDate(new Date(today.getFullYear(), 0, 1)); endInput.value = formatDate(today); }
            applySearchFilters();
        }

        function formatDate(date) {
            var y = date.getFullYear();
            var m = String(date.getMonth() + 1);
            if (m.length < 2) m = '0' + m;
            var d = String(date.getDate());
            if (d.length < 2) d = '0' + d;
            return y + '-' + m + '-' + d;
        }

        function openAddModal(rapid) {
            isRapidMode = !!rapid;
            document.getElementById('customerId').value = '';
            document.getElementById('modalTitle').innerText = isRapidMode ? '⚡ 大量收据连续快速录入模式' : '新增客户资料';
            document.getElementById('saveBtn').innerText = isRapidMode ? '保存并录入下一张 (Enter)' : '保存记录';

            document.getElementById('inputName').value = '';
            document.getElementById('inputPhone').value = '';
            document.getElementById('inputCarModel').value = '';
            document.getElementById('inputVin').value = '';
            document.getElementById('inputReceiptNo').value = '';
            document.getElementById('inputAddress').value = '';
            document.getElementById('inputNotes').value = '';

            document.getElementById('customerModal').classList.add('active');
            document.getElementById('inputName').focus();
        }

        function closeModal() {
            document.getElementById('customerModal').classList.remove('active');
        }

        function saveCustomer(e) {
            if (e && e.preventDefault) e.preventDefault();
            var id = document.getElementById('customerId').value;
            var newRecord = {
                id: id ? parseInt(id) : Date.now(),
                purchase_date: document.getElementById('inputDate').value,
                name: document.getElementById('inputName').value.trim(),
                phone: document.getElementById('inputPhone').value.trim(),
                car_model: document.getElementById('inputCarModel').value.trim(),
                vin: document.getElementById('inputVin').value.trim().toUpperCase(),
                receipt_no: document.getElementById('inputReceiptNo').value.trim(),
                address: document.getElementById('inputAddress').value.trim(),
                notes: document.getElementById('inputNotes').value.trim()
            };

            var list = getStoredCustomers();
            if (id) {
                var idx = -1;
                for (var i = 0; i < list.length; i++) {
                    if (list[i].id === parseInt(id)) { idx = i; break; }
                }
                if (idx !== -1) list[idx] = newRecord;
            } else {
                list.push(newRecord);
            }

            setStoredCustomers(list);

            if (isRapidMode && !id) {
                document.getElementById('inputName').value = '';
                document.getElementById('inputPhone').value = '';
                document.getElementById('inputVin').value = '';
                document.getElementById('inputReceiptNo').value = '';
                document.getElementById('inputAddress').value = '';
                document.getElementById('inputNotes').value = '';
                document.getElementById('inputName').focus();
            } else {
                closeModal();
            }
        }

        function editCustomer(id) {
            var list = getStoredCustomers();
            var c = null;
            for (var i = 0; i < list.length; i++) {
                if (list[i].id === id) { c = list[i]; break; }
            }
            if (!c) return;

            isRapidMode = false;
            document.getElementById('customerId').value = c.id;
            document.getElementById('modalTitle').innerText = '编辑客户资料';
            document.getElementById('saveBtn').innerText = '更新保存';

            document.getElementById('inputDate').value = c.purchase_date;
            document.getElementById('inputName').value = c.name;
            document.getElementById('inputPhone').value = c.phone;
            document.getElementById('inputCarModel').value = c.car_model;
            document.getElementById('inputVin').value = c.vin;
            document.getElementById('inputReceiptNo').value = c.receipt_no || '';
            document.getElementById('inputAddress').value = c.address || '';
            document.getElementById('inputNotes').value = c.notes || '';
            document.getElementById('customerModal').classList.add('active');
        }

        function deleteCustomer(id, name) {
            if (!confirm('确定要删除客户【' + name + '】的记录吗？')) return;
            var list = getStoredCustomers().filter(function(item) { return item.id !== id; });
            setStoredCustomers(list);
        }

        function exportData() {
            var list = getStoredCustomers();
            if (list.length === 0) { alert('没有数据可导出！'); return; }
            var csv = '\ufeffID,购买日期,客户姓名,联系电话,购买车型,车架号,客户地址,收据编号,备注\n';
            list.forEach(function(c) {
                csv += '"' + c.id + '","' + c.purchase_date + '","' + c.name + '","' + c.phone + '","' + c.car_model + '","' + c.vin + '","' + (c.address||'') + '","' + (c.receipt_no||'') + '","' + (c.notes||'') + '"\n';
            });
            var link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
            link.download = '金华车行_客户资料导出_' + formatDate(new Date()) + '.csv';
            link.click();
        }

        function triggerImportCSV() {
            document.getElementById('csvFileInput').click();
        }

        function importCSVFile(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(evt) {
                var lines = evt.target.result.split('\n');
                var list = getStoredCustomers();
                lines.forEach(function(line, index) {
                    if (index === 0 || !line.trim()) return;
                    var cols = line.split(',').map(function(c) { return c.replace(/^"|"$/g, '').trim(); });
                    if (cols.length >= 5) {
                        list.push({
                            id: Date.now() + index,
                            purchase_date: cols || formatDate(new Date()),
                            name: cols || '',
                            phone: cols || '',
                            car_model: cols || '',
                            vin: cols || '',
                            address: cols || '',
                            receipt_no: cols || '',
                            notes: cols[8] || ''
                        });
                    }
                });
                setStoredCustomers(list);
                alert('数据导入成功！');
            };
            reader.readAsText(file, 'UTF-8');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
